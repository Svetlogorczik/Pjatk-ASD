<!doctype html>
<html lang="pl" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ASD — Algorytmy i struktury danych</title>
  <meta name="description" content="Wykłady, konspekty i ćwiczenia z Algorytmów i Struktur Danych (PL / EN / RU).">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <script>
    /* Set theme before first paint to avoid a flash of the wrong colours. */
    (function () {
      var t = null;
      try { t = localStorage.getItem('asd.theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body class="page">
  <a class="page__skip" href="#main" data-i18n="skip">Przejdź do treści</a>

  <header class="header">
    <button class="header__menu button button--icon" type="button" aria-controls="sidebar" aria-expanded="false" data-i18n-title="menu" title="Menu">
      <svg class="button__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <a class="header__logo logo" href="#/">
      <span class="logo__mark" aria-hidden="true">ASD</span>
      <span class="logo__text" data-i18n="siteTitle">Algorytmy i struktury danych</span>
    </a>
    <div class="header__actions">
      <div class="lang-switch" role="group" aria-label="Language">
        <button class="lang-switch__button" type="button" data-lang="pl">PL</button>
        <button class="lang-switch__button" type="button" data-lang="en">EN</button>
        <button class="lang-switch__button" type="button" data-lang="ru">RU</button>
      </div>
      <button class="theme-toggle button button--icon" type="button" data-i18n-title="theme" title="Motyw">
        <svg class="theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <div class="page__layout">
    <aside class="sidebar" id="sidebar" aria-label="Nawigacja">
      <nav class="nav" data-slot="nav"></nav>
    </aside>
    <div class="page__overlay" data-slot="overlay" hidden></div>

    <main class="page__main" id="main" tabindex="-1">
      <div class="page__content" data-slot="content">
        <p class="page__loading">…</p>
      </div>
    </main>

    <aside class="toc" aria-label="Spis treści" data-slot="toc"></aside>
  </div>

  <div class="drawer" data-slot="drawer" hidden>
    <div class="drawer__backdrop" data-drawer-close></div>
    <section class="drawer__panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <header class="drawer__header">
        <h2 class="drawer__title" id="drawer-title"></h2>
        <div class="drawer__actions">
          <button class="button button--ghost drawer__print" type="button" data-i18n="print">Drukuj</button>
          <button class="button button--icon" type="button" data-drawer-close data-i18n-title="close" title="Zamknij">
            <svg class="button__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
      </header>
      <div class="drawer__body prose" data-slot="drawer-body"></div>
    </section>
  </div>

  <div class="toast" data-slot="toast" role="status" aria-live="polite" hidden></div>

  <!-- core -->
  <script src="assets/js/core/namespace.js"></script>
  <script src="assets/js/core/storage.js"></script>
  <script src="assets/js/core/i18n.js"></script>
  <script src="assets/js/core/theme.js"></script>
  <script src="assets/js/core/loader.js"></script>
  <script src="assets/js/core/router.js"></script>
  <!-- rendering -->
  <script src="assets/js/render/highlight.js"></script>
  <script src="assets/js/render/diagrams.js"></script>
  <script src="assets/js/render/markdown.js"></script>
  <!-- components -->
  <script src="assets/js/components/code-block.js"></script>
  <script src="assets/js/components/drawer.js"></script>
  <script src="assets/js/components/toc.js"></script>
  <script src="assets/js/components/nav.js"></script>
  <script src="assets/js/components/progress.js"></script>
  <!-- pages -->
  <script src="assets/js/pages/home.js"></script>
  <script src="assets/js/pages/topic.js"></script>
  <script src="assets/js/pages/page.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
